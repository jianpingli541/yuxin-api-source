global:
  resolve_timeout: 5m
route:
  receiver: 'default'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
- name: 'default'
  webhook_configs:
  - url: 'http://alert-forwarder:5001/'
    send_resolved: true
  # 告警已接入 alert-forwarder (gateway-net); 外部渠道在 observability/alert-forwarder/config/webhooks.list 配置
inhibit_rules: []
