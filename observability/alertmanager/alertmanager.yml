global:
  resolve_timeout: 5m
route:
  receiver: 'default'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
- name: 'default'
  webhook_configs:
  - url: 'http://alert-forwarder:5001/'
    send_resolved: true
  # TODO: 接入真实通知渠道——钉钉/飞书/企业微信 webhook 或 SMTP
  # 替换上面的 url 为你的 webhook 地址,或加 email_configs
inhibit_rules: []
