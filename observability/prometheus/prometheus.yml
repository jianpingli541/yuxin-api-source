global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
  - static_configs:
    - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'yuxin-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['new-api:3000']
        labels:
          service: 'api-gateway'
          env: 'production'
