global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
  - static_configs:
    - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'yuxin-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['new-api:3000']
        labels:
          service: 'api-gateway'
          env: 'production'

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels: {service: 'postgres', env: 'production'}

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels: {service: 'redis', env: 'production'}

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels: {service: 'host', env: 'production'}

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels: {service: 'nginx', env: 'production'}

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels: {service: 'prometheus', env: 'production'}

  - job_name: 'alertmanager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['alertmanager:9093']
        labels: {service: 'alertmanager', env: 'production'}

  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['grafana:3000']
        labels: {service: 'grafana', env: 'production'}

  - job_name: 'clickhouse'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['clickhouse:9363']
        labels: {service: 'clickhouse', env: 'production'}
