services:
  alertmanager:
    image: prom/alertmanager:latest
    container_name: gateway-alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=5 http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    networks:
      - api-gateway_gateway-net

  prometheus:
    image: prom/prometheus:latest
    container_name: gateway-prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=5 http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - api-gateway_gateway-net

  grafana:
    image: grafana/grafana:latest
    container_name: gateway-grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=5 http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_PLUGINS_PREINSTALL=grafana-clickhouse-datasource
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - api-gateway_gateway-net

  alert-forwarder:
    build: ./observability/alert-forwarder
    container_name: gateway-alert-forwarder
    restart: unless-stopped
    volumes:
      - ./backups/alerts:/var/log/alert-forwarder
      - ./observability/alert-forwarder/config:/etc/alert-forwarder
    networks:
      - api-gateway_gateway-net

volumes:
  alertmanager_data:
  prometheus_data:
  grafana_data:

networks:
  api-gateway_gateway-net:
    external: true
