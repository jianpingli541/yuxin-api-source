<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#0F2847"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  
  <!-- 六边形外框 (科技感) -->
  <polygon 
    points="60,18 95,38 95,78 60,98 25,78 25,38" 
    fill="none" 
    stroke="url(#glow)" 
    stroke-width="2.5" 
    filter="url(#neon)"
    opacity="0.9"/>
  
  <!-- 内部网络节点 (代表 API 网关/路由) -->
  <!-- 中心节点 -->
  <circle cx="60" cy="58" r="4" fill="#00D4FF" filter="url(#neon)"/>
  
  <!-- 外围节点 -->
  <circle cx="60" cy="36" r="2.5" fill="#0099FF" opacity="0.8"/>
  <circle cx="79" cy="47" r="2.5" fill="#0099FF" opacity="0.8"/>
  <circle cx="79" cy="69" r="2.5" fill="#6366F1" opacity="0.8"/>
  <circle cx="60" cy="80" r="2.5" fill="#6366F1" opacity="0.8"/>
  <circle cx="41" cy="69" r="2.5" fill="#0099FF" opacity="0.8"/>
  <circle cx="41" cy="47" r="2.5" fill="#0099FF" opacity="0.8"/>
  
  <!-- 连线 (从中心到各节点) -->
  <line x1="60" y1="58" x2="60" y2="36" stroke="#00D4FF" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="58" x2="79" y2="47" stroke="#00D4FF" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="58" x2="79" y2="69" stroke="#00D4FF" stroke-width="1.2" opacity="0.5"/>
  <line x1="60" y1="58" x2="60" y2="80" stroke="#00D4FF" stroke-width="1.2" opacity="0.5"/>
  <line x1="60" y1="58" x2="41" y2="69" stroke="#00D4FF" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="58" x2="41" y2="47" stroke="#00D4FF" stroke-width="1.2" opacity="0.6"/>
  
  <!-- 外围节点间的连线 (网络拓扑) -->
  <line x1="60" y1="36" x2="79" y2="47" stroke="#0099FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="79" y1="47" x2="79" y2="69" stroke="#0099FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="79" y1="69" x2="60" y2="80" stroke="#6366F1" stroke-width="0.8" opacity="0.3"/>
  <line x1="60" y1="80" x2="41" y2="69" stroke="#6366F1" stroke-width="0.8" opacity="0.3"/>
  <line x1="41" y1="69" x2="41" y2="47" stroke="#0099FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="41" y1="47" x2="60" y2="36" stroke="#0099FF" stroke-width="0.8" opacity="0.3"/>
  
  <!-- YX 字母标记 (底部) -->
  <text x="60" y="112" 
    font-family="SF Pro Display, -apple-system, system-ui, sans-serif" 
    font-size="11" 
    font-weight="700" 
    letter-spacing="2"
    text-anchor="middle" 
    fill="url(#text)">YUXIN</text>
</svg>
