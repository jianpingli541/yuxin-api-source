name: CI

on:
  pull_request:
    types: [opened, synchronize, closed]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gofmt-check:
    name: Go format check (gofmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Run gofmt -l
        run: |
          UNFORMATTED=$(go fmt ./...)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Files not gofmt-ed:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "All Go files pass gofmt."

  backend-vet:
    name: Backend vet
    needs: [gofmt-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Vet root module
        run: go vet ./...
      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

  backend-build:
    name: Backend build
    needs: [backend-vet]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Build root module
        run: go build ./...
      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

  backend-test:
    name: Backend test (race + coverage)
    needs: [backend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Test root module with race detector
        run: |
          mkdir -p web/dist && touch web/dist/index.html
          GOWORK=off go test -race -coverprofile=coverage-root.out -covermode=atomic ./...
      - name: Test relaykit with race detector
        working-directory: relaykit
        run: |
          GOWORK=off go test -race -coverprofile=coverage-relaykit.out -covermode=atomic ./...
      - name: Coverage summary
        run: |
          echo "=== Root coverage ==="
          go tool cover -func=coverage-root.out | tail -1
          echo "=== Relaykit coverage ==="
          cd relaykit && go tool cover -func=coverage-relaykit.out | tail -1
          # TODO(coverage): Enforce >=60% gate once test suite reaches target.
          # Uncomment the next lines when coverage meets the threshold:
          # ROOT_PCT=$(go tool cover -func=coverage-root.out | tail -1 | awk '{print $3}' | tr -d '%')
          # RELAY_PCT=$(cd relaykit && go tool cover -func=coverage-relaykit.out | tail -1 | awk '{print $3}' | tr -d '%')
          # if [ "${ROOT_PCT:-0}" -lt 60 ] || [ "${RELAY_PCT:-0}" -lt 60 ]; then
          #   echo "::warning::Coverage below 60%% -- set gate after fixing tests"
          # fi

  secret-scan:
    name: Secret scan (gitleaks / grep fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.22.0/gitleaks_8.22.0_linux_x64.tar.gz | tar xz -C /usr/local/bin
      - name: Run gitleaks
        run: gitleaks detect --log-level=warn --no-git || true
        # NOTE: Remove `|| true` to make secret leaks a hard failure.

  dependency-scan-trivy:
    name: Trivy filesystem scan (CVE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0
        with:
          version: v0.57.0
      - name: Scan Go module dependencies
        run: |
          trivy fs \
            --scanners=vuln \
            --severity=CRITICAL,HIGH \
            --exit-code=1 \
            .
        continue-on-error: false
        # Exit code 1 = vulnerabilities found; CI fails.
        # For warning-only mode: change --exit-code=1 to --exit-code=0
      # NOTE: For full image scan add:
      # - name: Scan Docker image yuxin-api:latest
      #   run: trivy image --severity CRITICAL,HIGH --exit-code=1 yuxin-api:latest
      # Requires docker/buildx step before this job.

  frontend:
    name: Frontend typecheck and test
    needs: [gofmt-check]
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Create embed placeholder
        run: |
          mkdir -p ../web/dist
          touch ../web/dist/index.html
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
