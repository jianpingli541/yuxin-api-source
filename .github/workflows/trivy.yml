name: Trivy Security Scan

on:
  pull_request:
    types: [opened, synchronize]
  schedule:
    # Every Monday at 06:00 UTC (quiet hour)
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  trivy-fs:
    name: Filesystem scan (Go deps CVE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0
        with:
          version: v0.57.0

      - name: Scan Go module dependencies
        run: |
          trivy fs \
            --scanners=vuln \
            --severity=CRITICAL,HIGH \
            --exit-code=1 \
            --format=json \
            --output=trivy-report.json \
            .
        continue-on-error: false
        # Exit code 1 = vulnerabilities found; CI fails.
        # Adjust severity or use --exit-code=0 for warning-only mode.

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-report.json
          retention-days: 30

  trivy-image:
    name: Image scan (yuxin-api:latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [trivy-fs]
    # Only run on push to main (not every PR) to avoid docker build cost in PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build yuxin-api image
        run: |
          mkdir -p web/dist && touch web/dist/index.html
          docker build -t yuxin-api:latest .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0
        with:
          version: v0.57.0

      - name: Scan Docker image
        run: |
          trivy image \
            --scanners=vuln \
            --severity=CRITICAL,HIGH \
            --exit-code=1 \
            --format=json \
            --output=trivy-image-report.json \
            yuxin-api:latest
        continue-on-error: false

      - name: Upload Trivy image report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          retention-days: 30
