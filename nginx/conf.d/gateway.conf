# ============================================================
# API Gateway - Nginx Reverse Proxy (v3 - HTTPS + 安全头加固)
# 变更:
#   - 80 端口仅保留 /metrics(内网)与 ACME HTTP-01 挑战路径,
#     其余全部 301 跳转 https(为 Let's Encrypt 切换预留)。
#   - 443 端口挂自签证书(nginx/ssl/selfsigned.*),
#     ai.yuxin.yun 已有公网 DNS,当前仍用覆盖域名+IP 的自签证书;可换 Let's Encrypt 正式证书。
#   - 补齐 HSTS / CSP / Permissions-Policy / Cross-Origin-* 头。
# ============================================================

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=api_strict:10m rate=60r/m;

# Upstream
upstream new-api {
    server new-api:3000;
    keepalive 64;
}

# ---- 通用代理头 ----
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 103.55.131.130 103.55.131.131 103.55.131.132 103.55.131.133 103.55.131.134 ai.yuxin.yun;

    # Let's Encrypt ACME HTTP-01 挑战(切真实证书时用)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Prometheus 指标(仅内网可达,保持原策略)
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 其余全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 103.55.131.130 103.55.131.131 103.55.131.132 103.55.131.133 103.55.131.134 ai.yuxin.yun;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/ai.yuxin.yun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.yuxin.yun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 安全头 ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # CSP:允许内联样式/脚本以兼容现有前端;后续可按 console 报告收紧
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Max upload size
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ============ 不限速的公开端点 ============

    # Prometheus 指标(仅内网访问)
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 公开定价 API(高频访问)
    location = /api/public/pricing {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 状态页 API(高频访问)
    location = /api/status_page {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 模型广场 API(高频访问)
    location = /api/marketplace/models {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 路由配置 API
    location = /api/routing/config {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP 工具列表
    location = /api/mcp/tools {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Canary 状态
    location = /api/canary/status {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 安全合规配置
    location = /api/compliance/config {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location = /api/status {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 安全合规检查 API(POST请求,不限速)
    location = /api/compliance/check {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboard 聚合 API
    location = /api/dashboard/overview {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP 工具执行
    location = /api/mcp/execute {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============ 主 API 路由 ============

    location / {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings (for streaming)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for SSE/streaming
        proxy_buffering off;
        proxy_cache off;

        # Rate limiting (burst=200 容纳验收测试)
        limit_req zone=api_limit burst=200 nodelay;
    }

    # Static assets (long cache, no rate limit)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://new-api;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Block common attack paths
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
