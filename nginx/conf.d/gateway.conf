# ============================================================
# API Gateway - Nginx Reverse Proxy (v4 - 安全加固 v2)
# 变更(v4, 2026-08-04):
#   - 隐藏后端版本指纹头 x-new-api-version(proxy_hide_header)
#   - /api/status 响应体 version 字段脱敏(sub_filter)
#   - 屏蔽 /api/setup(初始化端点, 系统已初始化)
#   - /api/user/register 严格限流(5r/m/IP, 防批量注册滥用)
#   - 安全头抽为 security_headers.conf 统一 include(修复静态资源
#     location 因自带 add_header 而不继承 server 级安全头的问题)
#   - CSP 移除 script-src 'unsafe-inline'(dist 无内联脚本)
#   - 补 Cross-Origin-Embedder-Policy / X-Permitted-Cross-Domain-Policies
# 历史(v3): 80 端口 301 / Let's Encrypt / 补齐基础安全头
# ============================================================

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=api_strict:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=reg_limit:10m rate=5r/m;

# Upstream
upstream new-api {
    server new-api:3000;
    keepalive 64;
}

upstream wechat-server {
    server wechat-server:3000;
    keepalive 8;
}

# ---- 通用代理头 ----
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 203.0.113.10 203.0.113.10 203.0.113.10 203.0.113.10 203.0.113.10 ai.yuxin.yun;

    # Let's Encrypt ACME HTTP-01 挑战(切真实证书时用)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Prometheus 指标(仅内网可达,保持原策略)
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 其余全部跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 203.0.113.10 203.0.113.10 203.0.113.10 203.0.113.10 203.0.113.10 ai.yuxin.yun;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/ai.yuxin.yun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.yuxin.yun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 隐藏后端版本指纹头(new-api 默认响应头, 每个响应均带)
    proxy_hide_header x-new-api-version;

    # ---- 安全头(统一 include, 静态资源 location 亦需覆盖) ----
    include /etc/nginx/conf.d/security_headers.conf;

    # Max upload size
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ============ 不限速的公开端点 ============

    # Prometheus 指标(仅内网访问)
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 公开定价 API(高频访问)
    location = /api/public/pricing {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 状态页 API(高频访问)
    location = /api/status_page {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 模型广场 API(高频访问)
    location = /api/marketplace/models {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 路由配置 API
    location = /api/routing/config {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP 工具列表
    location = /api/mcp/tools {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Canary 状态
    location = /api/canary/status {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 安全合规配置
    location = /api/compliance/config {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 初始化端点屏蔽(系统已初始化, 前端不再调用; 防止状态探测与未初始化利用)
    location = /api/setup {
        return 404;
    }

    # 注册端点严格限流(防批量注册滥用; 5r/m/IP, 超出返回 429)
    location = /api/user/register {
        limit_req zone=reg_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查(公开) - 隐藏 body 中的 version 字段, 避免版本指纹泄露
    # 注: sub_filter 匹配当前镜像版本号(v1.2.0-yuxin), 升级后需同步
    location = /api/status {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        sub_filter '"version":"v1.2.0-yuxin"' '"version":"unknown"';
        sub_filter_once on;
        sub_filter_types application/json;
        access_log off;
    }

    # 安全合规检查 API(POST请求,不限速)
    location = /api/compliance/check {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboard 聚合 API
    location = /api/dashboard/overview {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP 工具执行
    location = /api/mcp/execute {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============ 微信公众号回调 (wechat-server) ============
    # mp.weixin.qq.com 公众号服务器地址: https://ai.yuxin.yun/api/wechat
    location /api/wechat {
        proxy_pass http://wechat-server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ 主 API 路由 ============

    location / {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings (for streaming)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for SSE/streaming
        proxy_buffering off;
        proxy_cache off;

        # Rate limiting (burst=200 容纳验收测试)
        limit_req zone=api_limit burst=200 nodelay;
    }

    # Static assets (long cache, no rate limit)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://new-api;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/conf.d/security_headers.conf;
        access_log off;
    }

    # Block common attack paths
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
