# ============================================================
# API Gateway - Nginx Reverse Proxy (v2 - 修复限速误触发)
# ============================================================

# Rate limiting zone (提高到 120r/m)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=api_strict:10m rate=60r/m;

# Upstream
upstream new-api {
    server new-api:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ============ 不限速的公开端点 ============

    # Prometheus 指标（仅内网访问）
    location = /metrics {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 公开定价 API（高频访问）
    location = /api/public/pricing {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 状态页 API（高频访问）
    location = /api/status_page {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 模型广场 API（高频访问）
    location = /api/marketplace/models {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 路由配置 API
    location = /api/routing/config {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP 工具列表
    location = /api/mcp/tools {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Canary 状态
    location = /api/canary/status {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 安全合规配置
    location = /api/compliance/config {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 健康检查
    location = /api/status {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # 安全合规检查 API（POST请求,不限速）
    location = /api/compliance/check {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dashboard 聚合 API
    location = /api/dashboard/overview {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MCP 工具执行
    location = /api/mcp/execute {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============ 主 API 路由 ============

    location / {
        proxy_pass http://new-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings (for streaming)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for SSE/streaming
        proxy_buffering off;
        proxy_cache off;

        # Rate limiting (burst=200 容纳验收测试)
        limit_req zone=api_limit burst=200 nodelay;
    }

    # Static assets (long cache, no rate limit)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://new-api;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block common attack paths
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Custom error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
