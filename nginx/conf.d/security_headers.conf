# 安全响应头（server 级与 static location 共用，避免 add_header 继承丢失）
# 2026-08-04 加固: 新增 COEP / X-Permitted-Cross-Domain-Policies; CSP 移除 'unsafe-inline'
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# CSP: dist/index.html 无内联脚本, 故移除 script-src 'unsafe-inline';
#     保留 'unsafe-eval'(bundle 兼容); style-src 保留 'unsafe-inline'(React 动态样式)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
